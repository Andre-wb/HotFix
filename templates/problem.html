{% extends "base.html" %}

{% block title %}{{ problem.name }}{% endblock %}

{% block main %}
<div class="container">
    <div class="card">
        <h1>{{ problem.name }}</h1>

        <div class="meta">
            <span class="difficulty">{{ problem.difficulty }}</span>
            <span class="lang">{{ problem.language }}</span>
            <span class="timer">⏱️ Time limit: <span id="timer">{{ problem.time_limit_seconds }}</span>s</span>
        </div>

        <div class="description">
            <h3>Description</h3>
            <p>{{ problem.description }}</p>
        </div>

        <form action="/problems/{{ problem.id }}/submit" method="post" id="solve-form">
            <input type="hidden" name="start_time" value="{{ start_time }}">
            <label>Fix the code:</label>
            <div class="code-editor">
                <textarea name="code" rows="25" required>{{ problem.incorrect_version }}</textarea>
            </div>
            <button type="submit">🚀 Submit Solution</button>
        </form>
    </div>
</div>

<script>
    window.problemTimeLimit = {{ problem.time_limit_seconds }};
</script>
{% endblock %}
