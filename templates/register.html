{% extends "base.html" %}

{% block title %}Sign Up — HotFix{% endblock %}

{% block main %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h1 class="form-title">Create Account</h1>
            <p class="form-subtitle">Join the debugging community</p>
        </div>

        {% if let Some(message) = flash_message %}
        <div class="flash-message flash-error">
            <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" style="fill: var(--accent);transform: ;msFilter:;"><path d="M12.884 2.532c-.346-.654-1.422-.654-1.768 0l-9 17A.999.999 0 0 0 3 21h18a.998.998 0 0 0 .883-1.467L12.884 2.532zM13 18h-2v-2h2v2zm-2-4V9h2l.001 5H11z"></path></svg>️</span>
            <span>{{ message }}</span>
        </div>
        {% endif %}

        <form action="/register" method="post">
            <div class="form-group">
                <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        placeholder="username"
                        value='{{ username.as_deref().unwrap_or("") }}'
                required
                autofocus
                minlength="3"
                >
            </div>

            <div class="form-group">
                <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="your@email.com"
                        value='{{ email.as_deref().unwrap_or("") }}'
                required
                >
            </div>

            <div class="form-group">
                <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="password"
                        value='{{ password.as_deref().unwrap_or("") }}'
                required
                minlength="8"
                >
            </div>

            <div class="form-group">
                <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-input"
                        placeholder="confirm password"
                        value='{{ confirm_password.as_deref().unwrap_or("") }}'
                required
                >
            </div>

            <button type="submit" class="btn">
                <span>Create Account</span>
            </button>
        </form>

        <div class="form-footer">
            <p>Already have an account?</p>
            <a href="/login">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
