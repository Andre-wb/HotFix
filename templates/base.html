<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HotFix - Debugging Challenges{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/scramble_animation.js"></script>
    <script src="/static/js/menu.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
<header>
    <nav>
        <a href="/" class="brand">
            <span>HotFix</span>
        </a>

        <div class="nav-links" id="nav-links">
            <a href="/problems" class="nav-link">Problems</a>

            {% if logged_in %}
            <a href="/profile" class="nav-link">Profile</a>
            <a href="/logout" class="nav-link">Logout</a>
            {% else %}
            <a href="/login" class="nav-link">Sign In</a>
            <a href="/register" class="nav-link">Sign Up</a>
            {% endif %}
        </div>

        <button class="menu" type="button" id="menu">
            <span class="line" id="line-1"></span>
            <span class="line" id="line-2"></span>
            <span class="line" id="line-3"></span>
        </button>
    </nav>
</header>

<main class="main">
    {% block main %}{% endblock %}
</main>

<script src="/static/js/editor.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
