{% extends "base.html" %}

{% block title %}2FA Verification{% endblock %}

{% block main %}
{% if let Some(message) = flash_message %}
<div>{{ message }}</div>
{% endif %}

<form action="/2fa_confirm" method="post">
    <input type="text" name="confirm_code" placeholder="Enter verification code" value='{{ confirm_code.as_deref().unwrap_or("") }}' required><br>
    <button type="submit">Verify</button>
</form>
{% endblock %}
