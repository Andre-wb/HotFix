{% extends "base.html" %}

{% block title %}Confirm email{% endblock %}

{% block main %}
{% if let Some(message) = flash_message %}
<div>{{ message }}</div>
{% endif %}
<p>Verification code has been sent to your email. Enter it to confirm your email.</p>
<form action="/2fa_confirm" method="post">
    <input type="text" name="confirm_code" placeholder="000000" required><br>
    <button type="submit">Confirm</button>
</form>
{% endblock %}
