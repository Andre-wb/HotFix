[package]
name = "hotfix"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
askama = "0.13"
argon2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
serde_json = "1.0.149"
http-body-util = "0.1.3"
tower = "0.5.3"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }
rand = { version = "0.8", features = ["std_rng"] }  # Remove "thread_rng" - it's not a feature
sha2 = "0.11.0"
hex = "0.4.3"
tower-sessions = "0.13"
tower-sessions-sqlx-store = { version = "0.14", features = ["postgres"] }
time = "0.3.47"
reqwest = { version = "0.13.3", features = ["json"] }
tower-http = { version = "0.6.10", features = ["full"] }