[package]
name = "HotFix"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
askama = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.10.3"
base64 = "0.22.1"
serde = "1.0.228"
argon2 = "0.5.3"
dotenvy = "0.15.7"
sqlx-cli = "0.8.6"
